# Training Configuration for Multi-Dataset ECG Disease Detection

# Dataset Configuration
data:
  use_brugada: true
  brugada_metadata_path: "brugada_database.csv"
  brugada_scp_statements_path: "brugada_scp_statements.csv"
  brugada_data_root: "/N/slate/hungill/waveform"

  use_ptbxl: true
  ptbxl_metadata_path: "ptbxl/ptbxl_database.csv"
  ptbxl_data_root: "ptbxl/"
  ptbxl_scp_statements_path: "ptbxl/scp_statements.csv"
  ptbxl_sampling_ratio: 1.0

  target_sampling_rate: 100
  target_length_seconds: 10.0

  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  stratified: true
  random_seed: 42

  batch_size: 128
  num_workers: 4
  pin_memory: true

  normalize: true
  normalization_method: "standardize"

  augment_train: true
  augment_val: false

  augmentation:
    amplitude_scale_range: [0.8, 1.2]
    amplitude_scale_prob: 0.3
    noise_std: 0.05
    noise_prob: 0.3
    baseline_wander_amplitude: 0.1
    baseline_wander_frequency: [0.1, 0.5]
    baseline_wander_prob: 0.2
    time_warp_sigma: 0.2
    time_warp_knots: 4
    time_warp_prob: 0.15
    lead_scale_range: [0.9, 1.1]
    lead_scale_prob: 0.2
    lead_masking_prob: 0.3
    lead_masking_max_leads: 6
    crop_prob: 0.5
    min_crop_seconds: 3.0

# Model Configuration
model:
  architecture: "ecg_transformer_rope"
  size: "large"
  in_channels: 12
  num_superclasses: 5
  num_subclasses: 23
  dropout: 0.2

# Loss Configuration
loss:
  type: "focal"
  task_weights:
    superclass: 2.0
    subclass: 1.0
  focal:
    alpha_superclass: 0.65
    alpha_subclass: 0.35   # default for all subclasses not listed below
    gamma: 1.5
    # ── Per-class alpha overrides ──────────────────────────────────────────
    # Increase alpha for morphologically hard or high-overlap subclasses to
    # penalise false negatives more heavily on those specific classes.
    #
    # Rationale for each override:
    #   IVCD:    heterogeneous category, heavily overlaps CLBBB/CRBBB
    #   LAO/LAE: subtle voltage criteria, high co-occurrence with LVH/HYP
    #   NST_:    non-specific ST changes, high overlap with STTC and NORM
    #   LMI:     small sample count, benefits from stronger positive weighting
    #
    # Set a class to 0.25 (the default) to remove its override.
    subclass_alpha_overrides:
      IVCD:    0.40
      LAO/LAE: 0.40
      SEHYP:   0.45
      NST_:    0.35
      LMI:     0.40
      ISCI:    0.35

# Training Configuration
training:
  max_epochs: 150
  learning_rate: 0.0001
  weight_decay: 0.005

  scheduler:
    type: "cosine"
    t_max: 150
    warmup_epochs: 10

  early_stopping:
    monitor: "val_total_loss"   # restore this
    patience: 40
    mode: "min"                 # restore this

  checkpoint:
    monitor: "val_combined_auroc"   # keep this
    mode: "max"
    filename: "multitask-{epoch:02d}-{val_combined_auroc:.3f}"
    save_top_k: 3
    
  # Weights for val_combined_auroc = w_sup * sup_auroc + w_sub * sub_auroc
  combined_auroc_weights:
    superclass: 0.4
    subclass: 0.6

# Hardware Configuration
hardware:
  accelerator: "gpu"
  devices: 4
  num_nodes: 1
  precision: "32-true"
  strategy: "ddp"

# Logging Configuration
logging:
  log_every_n_steps: 10
  log_model: true
  project_name: "multi-ecg-disease-detection"
  run_name: null

# Cross-Validation (Optional)
cross_validation:
  enabled: false
  n_folds: 5
  stratified: true
