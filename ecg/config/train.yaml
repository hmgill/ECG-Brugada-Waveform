# ═══════════════════════════════════════════════════════════════════════════════
# train.yaml  —  HuBERT-ECG multi-task classifier
# ═══════════════════════════════════════════════════════════════════════════════
#
# Key differences from the original ECGTransformerRoPE config:
#   1. model.architecture: hubert_ecg  (was: ecg_transformer_rope)
#   2. model.hubert_size, model.encoder_lr, model.freeze_encoder_epochs (new)
#   3. data.target_sampling_rate: 100  (unchanged — HuBERT-ECG expects 100 Hz)
#   4. training.learning_rate lowered to 5e-5 (fine-tuning regime)
#   5. training.max_epochs reduced; early stopping patience raised
#   6. Batch size reduced slightly to fit HuBERT-ECG BASE into GPU memory
#      (768-dim encoder).  Increase gradient_clip_val if loss spikes.
# ═══════════════════════════════════════════════════════════════════════════════


# ── Data ──────────────────────────────────────────────────────────────────────
data:
  # Dataset sources
  use_brugada: true
  use_ptbxl:   true

  # Paths — adjust to your environment
  brugada_metadata_path:      brugada_database.csv
  brugada_scp_statements_path: brugada_scp_statements.csv
  brugada_data_root:          /N/slate/hungill/waveform

  ptbxl_metadata_path:        ptbxl/ptbxl_database.csv
  ptbxl_data_root:            ptbxl/        # 100 Hz files (filename_lr)
  ptbxl_scp_statements_path:  ptbxl/scp_statements.csv
  ptbxl_sampling_ratio:       1.0                          # use all PTB-XL records

  # Signal preprocessing
  target_sampling_rate:  100     # Hz
  target_length_seconds: 10.0   # seconds (split into 2×5 s windows internally)

  # Splits
  train_split: 0.70
  val_split:   0.15
  test_split:  0.15
  stratified:  true

  # DataLoader
  batch_size:   64       # reduce to 16 if GPU OOM with BASE encoder
  num_workers:  4
  pin_memory:   true

  # Normalisation
  normalize:            true
  normalization_method: standardize   # per-lead z-score, same as HuBERT pretraining

  # Augmentation (applied to training set only)
  augment_train: true
  augment_val:   false

  augmentation:
    # Amplitude scaling  — simulates lead gain variation
    amplitude_scale_range: [0.8, 1.2]
    amplitude_scale_prob:  0.3

    # Gaussian noise  — simulates electrode noise
    noise_std:  0.05
    noise_prob: 0.3

    # Baseline wander  — simulates respiration / movement artefact
    baseline_wander_amplitude: 0.1
    baseline_wander_frequency: [0.1, 0.5]
    baseline_wander_prob: 0.2

    # Time warping  — subtle timing variation
    time_warp_sigma: 0.2
    time_warp_knots: 4
    time_warp_prob:  0.15

    # Per-lead scaling  — simulates inter-lead gain differences
    lead_scale_range: [0.9, 1.1]
    lead_scale_prob:  0.2

    # Lead masking  — improves robustness to missing leads
    lead_masking_prob:     0.2
    lead_masking_max_leads: 3   # mask at most 3 of 12 leads

    # signal cropping
    crop_prob: 0.0
    min_crop_seconds: 3.0

  random_seed: 42


# ── Model ─────────────────────────────────────────────────────────────────────
model:
  architecture:  hubert_ecg          # was: ecg_transformer_rope
  in_channels:   12
  num_superclasses: 5

  # HuBERT-ECG encoder size
  #   small  → 256-d hidden, ~23 M params  — fast, fits on GTX 1660 Ti
  #   base   → 768-d hidden, ~91 M params  — recommended, fits on A100 easily
  #   large  → 1024-d hidden, ~316 M params — for ablations only
  hubert_size: base

  # Classification head dropout
  dropout: 0.1

  # Temporal pooling of encoder output sequence
  #   mean  — average all token positions (more stable, recommended)
  #   cls   — use first token position only (enables attention visualisation)
  pool_mode: mean

  # ── Encoder warm-up ────────────────────────────────────────────────────────
  # The encoder is frozen for this many epochs (linear-probe phase).
  # After this, EncoderUnfreezeCallback unfreezes it and applies encoder_lr.
  # Rule of thumb: freeze for ~10 % of total epochs.
  freeze_encoder_epochs: 0

  # LR applied to the encoder after unfreezing.
  # Must be 5–20× smaller than training.learning_rate to avoid catastrophic
  # forgetting of pretrained representations.
  encoder_lr: 1.0e-5


# ── Loss ──────────────────────────────────────────────────────────────────────
loss:
  type: focal      # focal | weighted_bce

  # Weight of each task in the total loss
  task_weights:
    superclass: 1.0
    subclass:   1.0

  focal:
    # Global alpha for superclass head (fraction of positives upweighted)
    alpha_superclass: 0.75

    # Global alpha for subclass head — higher because subclasses are rarer
    alpha_subclass: 0.25

    # Focal exponent — reduces weight of easy negatives
    gamma: 2.0

    # Per-class alpha overrides for the rarest subclasses.
    # These values were tuned from AUROC vs F1 analysis; adjust after
    # running find_thresholds.py on your new checkpoint.
    subclass_alpha_overrides:
      BRUG:      0.99   # all positives from Brugada-HUCA; none in PTB-XL
      PMI:       0.95   # ~17 examples
      SEHYP:     0.95   # ~29 examples
      ILBBB:     0.90   # ~77 examples
      WPW:       0.90   # ~79 examples
      RAO/RAE:   0.85   # ~99 examples


# ── Training ──────────────────────────────────────────────────────────────────
training:
  # Head LR (encoder uses model.encoder_lr after warm-up)
  learning_rate: 5.0e-5   # lower than from-scratch; fine-tuning regime

  weight_decay: 1.0e-2

  # Gradient clipping — important when encoder unfreezes
  gradient_clip_val: 1.0

  max_epochs: 40

  # ── Checkpoint ─────────────────────────────────────────────────────────────
  checkpoint:
    monitor:    val_combined_auroc
    mode:       max
    save_top_k: 3
    filename:   "hubert-multitask-{epoch:02d}-{val_combined_auroc:.4f}"

  # ── Early stopping ─────────────────────────────────────────────────────────
  early_stopping:
    monitor:  val_combined_auroc
    patience: 20    # raised vs original — gives encoder room to stabilise
    mode:     max   # after unfreeze

  # ── LR scheduler ───────────────────────────────────────────────────────────
  scheduler:
    type: cosine

    # Short warmup — encoder representations already converged
    warmup_epochs: 5

    # Cosine decay over remaining epochs
    t_max: 100

  # Combined AUROC monitor weights (used for checkpoint + early stopping)
  combined_auroc_weights:
    superclass: 0.5
    subclass:   0.5


# ── Hardware ──────────────────────────────────────────────────────────────────
hardware:
  accelerator: "gpu"
  devices: 4
  num_nodes: 1
  precision: "32-true"
  strategy: "ddp"


# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  project_name:      ecg_hubert_multitask
  log_every_n_steps: 10

